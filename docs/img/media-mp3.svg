<rect x="32" y="104" width="296" height="26" rx="5" fill="#2a1a12" stroke="#ff8b52"/>
<rect x="42" y="117" width="3" height="7" fill="#ff8b52"/><rect x="47" y="112" width="3" height="12" fill="#ff8b52"/><rect x="52" y="115" width="3" height="9" fill="#ff8b52"/>
<text x="70" y="122" font-size="14" font-weight="700">Sample Track B</text><text x="316" y="121" class="m dim" font-size="10" text-anchor="end">4:05</text>
<rect x="32" y="134" width="296" height="26" rx="5" fill="#161e1b"/>
<text x="44" y="151" class="m dim" font-size="10">03</text><text x="70" y="152" font-size="14">Sample Track C</text><text x="316" y="151" class="m dim" font-size="10" text-anchor="end">2:48</text>
<rect x="32" y="164" width="296" height="26" rx="5" fill="#161e1b"/>
