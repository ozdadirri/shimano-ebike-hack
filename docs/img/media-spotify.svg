<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 360 280" role="img" aria-label="Now playing screen for Spotify on the phone: album art, song title, artist, progress 1:42 of 3:58, and volume down, previous, pause, next and volume up buttons. Sample values.">
<style>
text{font-family:"Saira Condensed","Arial Narrow","Roboto Condensed",sans-serif;fill:#e8f1ee}
.m{font-family:"JetBrains Mono",Menlo,Consolas,monospace}
.dim{fill:#93a39e}.ok{fill:#6cd07a}.acc{fill:#ff8b52}
</style>
<defs>
<g id="prev"><rect x="-9" y="-8" width="3" height="16"/><polygon points="8,-8 8,8 -5,0"/></g>
<g id="next"><rect x="6" y="-8" width="3" height="16"/><polygon points="-8,-8 -8,8 5,0"/></g>
<g id="pause"><rect x="-6" y="-8" width="4" height="16"/><rect x="2" y="-8" width="4" height="16"/></g>
</defs>
<rect width="360" height="280" rx="22" fill="#232a28"/>
<rect x="16" y="16" width="328" height="248" rx="8" fill="#0b0f0e"/>
<text x="32" y="42" class="m ok" font-size="11">BUS OK · 0 ERR</text>
<text x="328" y="42" class="m dim" font-size="11" text-anchor="end">BLE ● 14:32</text>
<text x="32" y="64" class="m acc" font-size="11">NOW PLAYING · SPOTIFY</text>
<rect x="32" y="74" width="92" height="92" rx="8" fill="#2c3a35"/>
<circle cx="70" cy="140" r="11" fill="#93a39e"/><rect x="78" y="94" width="5" height="46" fill="#93a39e"/><path d="M78,94 L106,87 L106,98 L83,104 Z" fill="#93a39e"/>
<text x="138" y="100" font-size="22" font-weight="700">Sample Song</text>
<text x="138" y="122" font-size="15" class="dim">Sample Artist</text>
<text x="138" y="142" class="m dim" font-size="10">Sample Album</text>
<text x="138" y="160" class="m dim" font-size="10">from phone · Bluetooth LE</text>
<rect x="32" y="180" width="296" height="5" rx="2.5" fill="#232a28"/>
<rect x="32" y="180" width="120" height="5" rx="2.5" fill="#ff8b52"/>
<circle cx="152" cy="182.5" r="6" fill="#ff8b52"/>
<text x="32" y="200" class="m dim" font-size="10">1:42</text>
<text x="328" y="200" class="m dim" font-size="10" text-anchor="end">3:58</text>
<rect x="32" y="212" width="44" height="40" rx="8" fill="none" stroke="#34403c"/>
<text x="54" y="236" font-size="12" font-weight="600" text-anchor="middle">VOL −</text>
<use href="#prev" xlink:href="#prev" x="120" y="232" fill="#e8f1ee"/>
<circle cx="180" cy="232" r="22" fill="#ff8b52"/>
<use href="#pause" xlink:href="#pause" x="180" y="232" fill="#1a0d06"/>
<use href="#next" xlink:href="#next" x="240" y="232" fill="#e8f1ee"/>
<rect x="284" y="212" width="44" height="40" rx="8" fill="none" stroke="#34403c"/>
<text x="306" y="236" font-size="12" font-weight="600" text-anchor="middle">VOL +</text>
</svg>
