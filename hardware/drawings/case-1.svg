<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" role="img" aria-label="Case drawings at 3 px per millimetre. Front view: 104.8 by 68.8 mm outline, 58 by 44 mm window, cable gland on the left and USB-C on the bottom. Back view: four counterbored M3 screws, the handlebar mount near the top, and the tap board outline hidden inside. Section: the bar and mount, shell with tap board, gasket, screen module, clear window and bezel, 45 mm total.">
<style>
svg { --bg: #eef2f0;
  --surface: #ffffff;
  --sunk: #e3e9e6;
  --fg: #15201c;
  --muted: #586661;
