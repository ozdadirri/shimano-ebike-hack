<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="XIAO ESP32-S3 pin map: D3/GPIO4 receives the comparator output; D0, D1, D7, D8, D9, D10 drive the SPI display; D4, D5, D6 connect the touch controller; D2/GPIO3 is a strapping pin and stays unused; 3V3 and GND connect to the board circuits.">
<style>
svg { --bg: #eef2f0;
  --surface: #ffffff;
  --sunk: #e3e9e6;
  --fg: #15201c;
  --muted: #586661;
  --line: #c9d3cf;
  --signal: #c2410c;
  --signal-soft: #fbe3d6;
  --power: #0f766e;
  --power-soft: #d3eeeb;
  --gnd: #7a8783;
  --good: #2f7d32;
  --warn: #a15c07;
  --bad: #b42318;
  --good-soft: #dcefdc;
  --warn-soft: #f6e8cf;
  --bad-soft: #f7dcd8;
  --display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace; color: var(--fg); background: var(--surface); }
svg text { font-family: var(--body); font-size: 13px; fill: currentColor; }
svg .t-sm { font-size: 11.5px; fill: var(--muted); }
svg .t-mono { font-family: var(--mono); font-size: 11.5px; }
svg .t-b { font-weight: 700; }
svg .t-sig { fill: var(--signal); }
svg .t-pwr { fill: var(--power); }
svg .box { fill: var(--surface); stroke: currentColor; stroke-width: 1.4; }
svg .box-sunk { fill: var(--sunk); stroke: var(--line); stroke-width: 1.2; }
svg .box-sig { fill: var(--signal-soft); stroke: var(--signal); stroke-width: 1.4; }
svg .box-pwr { fill: var(--power-soft); stroke: var(--power); stroke-width: 1.4; }
svg .board { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 6 5; }
svg .w { fill: none; stroke: currentColor; stroke-width: 1.6; }
svg .w-sig { fill: none; stroke: var(--signal); stroke-width: 2.2; }
svg .w-pwr { fill: none; stroke: var(--power); stroke-width: 2.2; }
svg .w-gnd { fill: none; stroke: var(--gnd); stroke-width: 1.8; }
svg .w-cable { fill: none; stroke: currentColor; stroke-width: 4; stroke-linecap: round; }
svg .w-dash { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 5 5; }
svg .dot { fill: currentColor; }
svg .dot-sig { fill: var(--signal); }
svg .dot-pwr { fill: var(--power); }
svg .fill-fg { fill: currentColor; }
svg .fill-bg { fill: var(--surface); stroke: currentColor; stroke-width: 1.6; }
svg .hl { fill: var(--signal-soft); }
svg .grid { stroke: var(--line); stroke-width: 1; }
svg .pcb-board { fill: #163d27; stroke: #0a2114; stroke-width: 2; }
svg .pcb-dot { fill: #1f5636; }
svg .pcb-hole { fill: var(--surface); stroke: #d8b25a; stroke-width: 3; }
svg .pcb-slot { fill: var(--surface); stroke: #d8b25a; stroke-width: 1.5; }
svg .pcb-pad { fill: #d8b25a; }
svg .pcb-via { fill: #d8b25a; stroke: #163d27; stroke-width: 1.5; }
svg .pcb-silk { fill: none; stroke: #eef3ec; stroke-width: 1.2; }
svg .pcb-silkd { fill: none; stroke: #eef3ec; stroke-width: 1.2; stroke-dasharray: 5 4; }
svg .pcb-silkt { fill: #eef3ec; font-family: var(--mono); font-size: 10px; }
svg .pcb-tp { fill: none; stroke: #4fd6c8; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
svg .pcb-ts { fill: none; stroke: #ff9e62; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
svg .pcb-tg { fill: none; stroke: #d8b25a; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
svg .pcb-tb { fill: none; stroke: #9fb8ff; stroke-width: 4; stroke-dasharray: 7 5; stroke-linecap: round; }
svg .pcb-zone-p { fill: none; stroke: #4fd6c8; stroke-width: 1; stroke-dasharray: 4 4; }
svg .pcb-zone-s { fill: none; stroke: #ff9e62; stroke-width: 1; stroke-dasharray: 4 4; }
svg .pcb-ring { fill: none; stroke: #ff9e62; stroke-width: 2.5; }
</style>

      <rect x="290" y="34" width="180" height="270" rx="16" class="box"/>
      <rect x="350" y="20" width="60" height="22" rx="5" class="box-sunk"/>
      <text x="380" y="35" text-anchor="middle" class="t-mono" style="font-size:10px">USB-C</text>
      <text x="380" y="182" text-anchor="middle" class="t-b">XIAO</text>
      <text x="380" y="200" text-anchor="middle" class="t-sm">ESP32-S3</text>
      <!-- left pins -->
      <g>
        <circle cx="290" cy="70" r="6" class="fill-bg"/><text x="304" y="74" class="t-mono">D0</text><text x="276" y="74" text-anchor="end">GPIO1 → LCD DC</text>
        <circle cx="290" cy="104" r="6" class="fill-bg"/><text x="304" y="108" class="t-mono">D1</text><text x="276" y="108" text-anchor="end">GPIO2 → LCD CS</text>
        <circle cx="290" cy="138" r="6" class="fill-bg"/><text x="304" y="142" class="t-mono">D2</text><text x="276" y="142" text-anchor="end" class="t-sm">GPIO3 · strapping pin, leave free</text>
        <circle cx="290" cy="172" r="7" class="dot-sig"/><text x="304" y="176" class="t-mono t-sig t-b">D3</text><text x="276" y="176" text-anchor="end" class="t-sig t-b">GPIO4 ← comparator (via R7)</text>
        <circle cx="290" cy="206" r="6" class="fill-bg"/><text x="304" y="210" class="t-mono">D4</text><text x="276" y="210" text-anchor="end">GPIO5 ↔ touch SDA</text>
        <circle cx="290" cy="240" r="6" class="fill-bg"/><text x="304" y="244" class="t-mono">D5</text><text x="276" y="244" text-anchor="end">GPIO6 → touch SCL</text>
        <circle cx="290" cy="274" r="6" class="fill-bg"/><text x="304" y="278" class="t-mono">D6</text><text x="276" y="278" text-anchor="end">GPIO43 ← touch INT</text>
      </g>
      <!-- right pins -->
      <g>
        <circle cx="470" cy="70" r="6" class="fill-bg"/><text x="456" y="74" text-anchor="end" class="t-mono">5V</text><text x="484" y="74" class="t-sm">USB only, leave unused</text>
        <circle cx="470" cy="104" r="6" class="fill-bg"/><text x="456" y="108" text-anchor="end" class="t-mono">GND</text><text x="484" y="108">bus GND · U2 · screen</text>
        <circle cx="470" cy="138" r="7" class="dot-pwr"/><text x="456" y="142" text-anchor="end" class="t-mono t-pwr t-b">3V3</text><text x="484" y="142" class="t-pwr">U1 out (Stage B) · U2 · screen</text>
        <circle cx="470" cy="172" r="6" class="fill-bg"/><text x="456" y="176" text-anchor="end" class="t-mono">D10</text><text x="484" y="176">GPIO9 → LCD MOSI</text>
        <circle cx="470" cy="206" r="6" class="fill-bg"/><text x="456" y="210" text-anchor="end" class="t-mono">D9</text><text x="484" y="210">GPIO8 ← LCD MISO (optional)</text>
        <circle cx="470" cy="240" r="6" class="fill-bg"/><text x="456" y="244" text-anchor="end" class="t-mono">D8</text><text x="484" y="244">GPIO7 → LCD SCK</text>
        <circle cx="470" cy="274" r="6" class="fill-bg"/><text x="456" y="278" text-anchor="end" class="t-mono">D7</text><text x="484" y="278">GPIO44 → LCD RST / backlight PWM</text>
      </g>
    </svg>