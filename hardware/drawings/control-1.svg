<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-label="Three ways to control the bike. A: the ESP32 presses the switch's own buttons through PhotoMOS relays, so the bus only sees genuine frames. B: the ESP32 transmits its own frames onto the bus, which risks errors. C: the ESP32 listens to the signals between chips inside the opened display.">
<style>
svg { --bg: #eef2f0;
  --surface: #ffffff;
  --sunk: #e3e9e6;
  --fg: #15201c;
  --muted: #586661;
  --line: #c9d3cf;
  --signal: #c2410c;
  --signal-soft: #fbe3d6;
  --power: #0f766e;
  --power-soft: #d3eeeb;
  --gnd: #7a8783;
  --good: #2f7d32;
  --warn: #a15c07;
  --bad: #b42318;
  --good-soft: #dcefdc;
  --warn-soft: #f6e8cf;
  --bad-soft: #f7dcd8;
  --display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace; color: var(--fg); background: var(--surface); }
svg text { font-family: var(--body); font-size: 13px; fill: currentColor; }
svg .t-sm { font-size: 11.5px; fill: var(--muted); }
svg .t-mono { font-family: var(--mono); font-size: 11.5px; }
svg .t-b { font-weight: 700; }
svg .t-sig { fill: var(--signal); }
svg .t-pwr { fill: var(--power); }
svg .box { fill: var(--surface); stroke: currentColor; stroke-width: 1.4; }
svg .box-sunk { fill: var(--sunk); stroke: var(--line); stroke-width: 1.2; }
svg .box-sig { fill: var(--signal-soft); stroke: var(--signal); stroke-width: 1.4; }
svg .box-pwr { fill: var(--power-soft); stroke: var(--power); stroke-width: 1.4; }
svg .board { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 6 5; }
svg .w { fill: none; stroke: currentColor; stroke-width: 1.6; }
svg .w-sig { fill: none; stroke: var(--signal); stroke-width: 2.2; }
svg .w-pwr { fill: none; stroke: var(--power); stroke-width: 2.2; }
svg .w-gnd { fill: none; stroke: var(--gnd); stroke-width: 1.8; }
svg .w-cable { fill: none; stroke: currentColor; stroke-width: 4; stroke-linecap: round; }
svg .w-dash { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 5 5; }
svg .dot { fill: currentColor; }
svg .dot-sig { fill: var(--signal); }
svg .dot-pwr { fill: var(--power); }
svg .fill-fg { fill: currentColor; }
svg .fill-bg { fill: var(--surface); stroke: currentColor; stroke-width: 1.6; }
svg .hl { fill: var(--signal-soft); }
svg .grid { stroke: var(--line); stroke-width: 1; }
svg .pcb-board { fill: #163d27; stroke: #0a2114; stroke-width: 2; }
svg .pcb-dot { fill: #1f5636; }
svg .pcb-hole { fill: var(--surface); stroke: #d8b25a; stroke-width: 3; }
svg .pcb-slot { fill: var(--surface); stroke: #d8b25a; stroke-width: 1.5; }
svg .pcb-pad { fill: #d8b25a; }
svg .pcb-via { fill: #d8b25a; stroke: #163d27; stroke-width: 1.5; }
svg .pcb-silk { fill: none; stroke: #eef3ec; stroke-width: 1.2; }
svg .pcb-silkd { fill: none; stroke: #eef3ec; stroke-width: 1.2; stroke-dasharray: 5 4; }
svg .pcb-silkt { fill: #eef3ec; font-family: var(--mono); font-size: 10px; }
svg .pcb-tp { fill: none; stroke: #4fd6c8; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
svg .pcb-ts { fill: none; stroke: #ff9e62; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
svg .pcb-tg { fill: none; stroke: #d8b25a; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
svg .pcb-tb { fill: none; stroke: #9fb8ff; stroke-width: 4; stroke-dasharray: 7 5; stroke-linecap: round; }
svg .pcb-zone-p { fill: none; stroke: #4fd6c8; stroke-width: 1; stroke-dasharray: 4 4; }
svg .pcb-zone-s { fill: none; stroke: #ff9e62; stroke-width: 1; stroke-dasharray: 4 4; }
svg .pcb-ring { fill: none; stroke: #ff9e62; stroke-width: 2.5; }
</style>

      <defs><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="fill-fg"/></marker></defs>
      <text x="20" y="24" class="t-b t-pwr">A · Press the switch's own buttons (recommended)</text>
      <rect x="20" y="34" width="120" height="44" rx="7" class="box"/><text x="80" y="61" text-anchor="middle">Touchscreen</text>
      <line x1="140" y1="56" x2="168" y2="56" class="w" marker-end="url(#mc)"/>
      <rect x="170" y="34" width="110" height="44" rx="7" class="box"/><text x="225" y="61" text-anchor="middle">ESP32-S3</text>
      <line x1="280" y1="56" x2="308" y2="56" class="w" marker-end="url(#mc)"/>
      <rect x="310" y="34" width="120" height="44" rx="7" class="box-pwr"/><text x="370" y="54" text-anchor="middle" class="t-b">PhotoMOS ×3</text><text x="370" y="70" text-anchor="middle" class="t-sm">isolated contacts</text>
      <line x1="430" y1="56" x2="458" y2="56" class="w" marker-end="url(#mc)"/>
      <rect x="460" y="34" width="150" height="44" rx="7" class="box"/><text x="535" y="54" text-anchor="middle" class="t-b">Assist switch</text><text x="535" y="70" text-anchor="middle" class="t-sm">its own chip sends</text>
      <line x1="610" y1="56" x2="758" y2="56" class="w-cable" style="stroke:var(--power)"/>
      <text x="684" y="46" text-anchor="middle" class="t-sm t-pwr">genuine frames</text>
      <rect x="760" y="34" width="120" height="44" rx="7" class="box"/><text x="820" y="61" text-anchor="middle">Motor</text>

      <text x="20" y="124" class="t-b t-sig">B · Transmit your own frames on the bus</text>
      <rect x="20" y="134" width="120" height="44" rx="7" class="box"/><text x="80" y="161" text-anchor="middle">Touchscreen</text>
      <line x1="140" y1="156" x2="168" y2="156" class="w" marker-end="url(#mc)"/>
      <rect x="170" y="134" width="110" height="44" rx="7" class="box"/><text x="225" y="161" text-anchor="middle">ESP32-S3</text>
      <line x1="280" y1="156" x2="308" y2="156" class="w" marker-end="url(#mc)"/>
      <rect x="310" y="134" width="300" height="44" rx="7" class="box-sig"/><text x="460" y="154" text-anchor="middle" class="t-b">BPSK transmitter (new hardware)</text><text x="460" y="170" text-anchor="middle" class="t-sm">+ every write command decoded</text>
      <line x1="610" y1="156" x2="758" y2="156" class="w-cable" style="stroke:var(--signal);stroke-dasharray:8 6"/>
      <text x="684" y="146" text-anchor="middle" class="t-sm t-sig">unknown device → E/W?</text>
      <rect x="760" y="134" width="120" height="44" rx="7" class="box"/><text x="820" y="161" text-anchor="middle">Motor</text>

      <text x="20" y="224" class="t-b t-sig">C · Wire into the display's circuit board</text>
      <rect x="20" y="234" width="120" height="44" rx="7" class="box"/><text x="80" y="261" text-anchor="middle">Touchscreen</text>
      <line x1="140" y1="256" x2="168" y2="256" class="w" marker-end="url(#mc)"/>
      <rect x="170" y="234" width="110" height="44" rx="7" class="box"/><text x="225" y="261" text-anchor="middle">ESP32-S3</text>
      <line x1="280" y1="256" x2="308" y2="256" class="w" marker-end="url(#mc)"/>
      <rect x="310" y="234" width="300" height="44" rx="7" class="box-sig"/><text x="460" y="254" text-anchor="middle" class="t-b">SC-E5000 opened</text><text x="460" y="270" text-anchor="middle" class="t-sm">listen to its internal chip signals</text>
      <line x1="610" y1="256" x2="758" y2="256" class="w-cable"/>
      <rect x="760" y="234" width="120" height="44" rx="7" class="box"/><text x="820" y="261" text-anchor="middle">Motor</text>
    </svg>