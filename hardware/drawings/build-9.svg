<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 225" role="img" aria-label="Stage B: BUS+ through a multimeter on the milliamp range, fuse and diode, closed JP1, choke and buck converter to the XIAO 3V3 pin; USB unplugged; scope through 1 nF checks the carrier is unchanged.">
<style>
svg { --bg: #eef2f0;
  --surface: #ffffff;
  --sunk: #e3e9e6;
  --fg: #15201c;
  --muted: #586661;
