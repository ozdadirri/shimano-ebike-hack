<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" role="img" aria-label="Firmware pipeline: GPIO4 feeds the RMT receiver with DMA, which produces pulse widths for a capture task. The capture task logs to USB and feeds the decoder, whose results go to the LVGL dashboard and the NimBLE GATT server.">
<style>
svg { --bg: #eef2f0;
  --surface: #ffffff;
  --sunk: #e3e9e6;
  --fg: #15201c;
  --muted: #586661;
  --line: #c9d3cf;
  --signal: #c2410c;
  --signal-soft: #fbe3d6;
  --power: #0f766e;
  --power-soft: #d3eeeb;
  --gnd: #7a8783;
  --good: #2f7d32;
  --warn: #a15c07;
  --bad: #b42318;
  --good-soft: #dcefdc;
  --warn-soft: #f6e8cf;
  --bad-soft: #f7dcd8;
  --display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace; color: var(--fg); background: var(--surface); }
svg text { font-family: var(--body); font-size: 13px; fill: currentColor; }
svg .t-sm { font-size: 11.5px; fill: var(--muted); }
svg .t-mono { font-family: var(--mono); font-size: 11.5px; }
svg .t-b { font-weight: 700; }
svg .t-sig { fill: var(--signal); }
svg .t-pwr { fill: var(--power); }
svg .box { fill: var(--surface); stroke: currentColor; stroke-width: 1.4; }
svg .box-sunk { fill: var(--sunk); stroke: var(--line); stroke-width: 1.2; }
svg .box-sig { fill: var(--signal-soft); stroke: var(--signal); stroke-width: 1.4; }
svg .box-pwr { fill: var(--power-soft); stroke: var(--power); stroke-width: 1.4; }
svg .board { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 6 5; }
svg .w { fill: none; stroke: currentColor; stroke-width: 1.6; }
svg .w-sig { fill: none; stroke: var(--signal); stroke-width: 2.2; }
svg .w-pwr { fill: none; stroke: var(--power); stroke-width: 2.2; }
svg .w-gnd { fill: none; stroke: var(--gnd); stroke-width: 1.8; }
svg .w-cable { fill: none; stroke: currentColor; stroke-width: 4; stroke-linecap: round; }
svg .w-dash { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 5 5; }
svg .dot { fill: currentColor; }
svg .dot-sig { fill: var(--signal); }
svg .dot-pwr { fill: var(--power); }
svg .fill-fg { fill: currentColor; }
svg .fill-bg { fill: var(--surface); stroke: currentColor; stroke-width: 1.6; }
svg .hl { fill: var(--signal-soft); }
svg .grid { stroke: var(--line); stroke-width: 1; }
svg .pcb-board { fill: #163d27; stroke: #0a2114; stroke-width: 2; }
svg .pcb-dot { fill: #1f5636; }
svg .pcb-hole { fill: var(--surface); stroke: #d8b25a; stroke-width: 3; }
svg .pcb-slot { fill: var(--surface); stroke: #d8b25a; stroke-width: 1.5; }
svg .pcb-pad { fill: #d8b25a; }
svg .pcb-via { fill: #d8b25a; stroke: #163d27; stroke-width: 1.5; }
svg .pcb-silk { fill: none; stroke: #eef3ec; stroke-width: 1.2; }
svg .pcb-silkd { fill: none; stroke: #eef3ec; stroke-width: 1.2; stroke-dasharray: 5 4; }
svg .pcb-silkt { fill: #eef3ec; font-family: var(--mono); font-size: 10px; }
svg .pcb-tp { fill: none; stroke: #4fd6c8; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
svg .pcb-ts { fill: none; stroke: #ff9e62; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
svg .pcb-tg { fill: none; stroke: #d8b25a; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
svg .pcb-tb { fill: none; stroke: #9fb8ff; stroke-width: 4; stroke-dasharray: 7 5; stroke-linecap: round; }
svg .pcb-zone-p { fill: none; stroke: #4fd6c8; stroke-width: 1; stroke-dasharray: 4 4; }
svg .pcb-zone-s { fill: none; stroke: #ff9e62; stroke-width: 1; stroke-dasharray: 4 4; }
svg .pcb-ring { fill: none; stroke: #ff9e62; stroke-width: 2.5; }
</style>

      <defs><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="fill-fg"/></marker></defs>
      <rect x="20" y="40" width="100" height="56" rx="7" class="box-sig"/><text x="70" y="64" text-anchor="middle" class="t-b">GPIO4</text><text x="70" y="82" text-anchor="middle" class="t-sm">comparator</text>
      <line x1="120" y1="68" x2="168" y2="68" class="w" marker-end="url(#ar2)"/><text x="144" y="58" text-anchor="middle" class="t-sm">edges</text>
      <rect x="170" y="40" width="160" height="56" rx="7" class="box"/><text x="250" y="64" text-anchor="middle" class="t-b">RMT RX + DMA</text><text x="250" y="82" text-anchor="middle" class="t-sm">12.5 ns ticks, hardware</text>
      <line x1="330" y1="68" x2="378" y2="68" class="w" marker-end="url(#ar2)"/><text x="354" y="58" text-anchor="middle" class="t-sm">frame</text>
      <rect x="380" y="40" width="160" height="56" rx="7" class="box"/><text x="460" y="64" text-anchor="middle" class="t-b">capture task</text><text x="460" y="82" text-anchor="middle" class="t-sm">idle &gt; 20 µs ends frame</text>
      <line x1="540" y1="68" x2="608" y2="68" class="w" marker-end="url(#ar2)"/><text x="574" y="58" text-anchor="middle" class="t-sm">widths</text>
      <rect x="610" y="40" width="270" height="56" rx="7" class="box-sunk"/><text x="745" y="64" text-anchor="middle" class="t-b">USB serial logger</text><text x="745" y="82" text-anchor="middle" class="t-sm">phase 5–6: to etube_decode.py</text>
      <line x1="460" y1="96" x2="460" y2="148" class="w" marker-end="url(#ar2)"/><text x="470" y="126" class="t-sm">phase 7+</text>
      <rect x="380" y="150" width="160" height="56" rx="7" class="box"/><text x="460" y="174" text-anchor="middle" class="t-b">decoder</text><text x="460" y="192" text-anchor="middle" class="t-sm">your field tables</text>
      <line x1="540" y1="168" x2="608" y2="150" class="w" marker-end="url(#ar2)"/>
      <line x1="540" y1="188" x2="608" y2="206" class="w" marker-end="url(#ar2)"/>
      <text x="574" y="140" text-anchor="middle" class="t-sm">state</text>
      <rect x="610" y="122" width="270" height="44" rx="7" class="box"/><text x="745" y="149" text-anchor="middle" class="t-b">LVGL dashboard · core 0</text>
      <rect x="610" y="184" width="270" height="44" rx="7" class="box"/><text x="745" y="211" text-anchor="middle" class="t-b">NimBLE GATT server</text>
      <text x="20" y="180" class="t-sm">Capture + decode pinned to core 1</text>
      <text x="20" y="198" class="t-sm">so the UI never makes you miss a frame.</text>
    </svg>