<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 225" role="img" aria-label="Three install steps: unplug the motor cable from the display, couple it to the Y-cable's 50 mm leg with an EW-JC200, then plug the 250 mm leg into the display.">
<style>
svg { --bg: #eef2f0;
  --surface: #ffffff;
  --sunk: #e3e9e6;
  --fg: #15201c;
  --muted: #586661;
  --line: #c9d3cf;
  --signal: #c2410c;
  --signal-soft: #fbe3d6;
  --power: #0f766e;
  --power-soft: #d3eeeb;
  --gnd: #7a8783;
  --good: #2f7d32;
  --warn: #a15c07;
  --bad: #b42318;
  --good-soft: #dcefdc;
  --warn-soft: #f6e8cf;
  --bad-soft: #f7dcd8;
  --display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace; color: var(--fg); background: var(--surface); }
svg text { font-family: var(--body); font-size: 13px; fill: currentColor; }
svg .t-sm { font-size: 11.5px; fill: var(--muted); }
svg .t-mono { font-family: var(--mono); font-size: 11.5px; }
svg .t-b { font-weight: 700; }
svg .t-sig { fill: var(--signal); }
svg .t-pwr { fill: var(--power); }
svg .box { fill: var(--surface); stroke: currentColor; stroke-width: 1.4; }
svg .box-sunk { fill: var(--sunk); stroke: var(--line); stroke-width: 1.2; }
svg .box-sig { fill: var(--signal-soft); stroke: var(--signal); stroke-width: 1.4; }
svg .box-pwr { fill: var(--power-soft); stroke: var(--power); stroke-width: 1.4; }
svg .board { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 6 5; }
svg .w { fill: none; stroke: currentColor; stroke-width: 1.6; }
svg .w-sig { fill: none; stroke: var(--signal); stroke-width: 2.2; }
svg .w-pwr { fill: none; stroke: var(--power); stroke-width: 2.2; }
svg .w-gnd { fill: none; stroke: var(--gnd); stroke-width: 1.8; }
svg .w-cable { fill: none; stroke: currentColor; stroke-width: 4; stroke-linecap: round; }
svg .w-dash { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 5 5; }
svg .dot { fill: currentColor; }
svg .dot-sig { fill: var(--signal); }
svg .dot-pwr { fill: var(--power); }
svg .fill-fg { fill: currentColor; }
svg .fill-bg { fill: var(--surface); stroke: currentColor; stroke-width: 1.6; }
svg .hl { fill: var(--signal-soft); }
svg .grid { stroke: var(--line); stroke-width: 1; }
svg .pcb-board { fill: #163d27; stroke: #0a2114; stroke-width: 2; }
svg .pcb-dot { fill: #1f5636; }
svg .pcb-hole { fill: var(--surface); stroke: #d8b25a; stroke-width: 3; }
svg .pcb-slot { fill: var(--surface); stroke: #d8b25a; stroke-width: 1.5; }
svg .pcb-pad { fill: #d8b25a; }
svg .pcb-via { fill: #d8b25a; stroke: #163d27; stroke-width: 1.5; }
svg .pcb-silk { fill: none; stroke: #eef3ec; stroke-width: 1.2; }
svg .pcb-silkd { fill: none; stroke: #eef3ec; stroke-width: 1.2; stroke-dasharray: 5 4; }
svg .pcb-silkt { fill: #eef3ec; font-family: var(--mono); font-size: 10px; }
svg .pcb-tp { fill: none; stroke: #4fd6c8; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
svg .pcb-ts { fill: none; stroke: #ff9e62; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
svg .pcb-tg { fill: none; stroke: #d8b25a; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
svg .pcb-tb { fill: none; stroke: #9fb8ff; stroke-width: 4; stroke-dasharray: 7 5; stroke-linecap: round; }
svg .pcb-zone-p { fill: none; stroke: #4fd6c8; stroke-width: 1; stroke-dasharray: 4 4; }
svg .pcb-zone-s { fill: none; stroke: #ff9e62; stroke-width: 1; stroke-dasharray: 4 4; }
svg .pcb-ring { fill: none; stroke: #ff9e62; stroke-width: 2.5; }
</style>

<defs><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="fill-fg"/></marker></defs>
<rect x="10" y="10" width="240" height="205" rx="10" class="box-sunk"/>
<rect x="270" y="10" width="240" height="205" rx="10" class="box-sunk"/>
<rect x="530" y="10" width="240" height="205" rx="10" class="box-sunk"/>
<text x="26" y="36" class="t-b">Step 1 · Unplug</text>
<text x="286" y="36" class="t-b">Step 2 · Couple</text>
<text x="546" y="36" class="t-b">Step 3 · Connect</text>
<!-- panel 1 -->
<line x1="22" y1="115" x2="100" y2="115" class="w-cable"/>
<rect x="100" y="105" width="24" height="20" rx="4" class="fill-bg"/>
<rect x="170" y="80" width="70" height="70" rx="8" class="box"/><text x="205" y="120" text-anchor="middle">Display</text>
<circle cx="170" cy="115" r="6" class="fill-bg"/>
<line x1="150" y1="85" x2="112" y2="85" class="w" marker-end="url(#m2)"/>
<text x="131" y="76" text-anchor="middle" class="t-sm">pull straight</text>
<path d="M98,140 L130,140 L126,128" class="w-sig"/>
<text x="112" y="160" text-anchor="middle" class="t-sm t-sig">TL-EW02</text>
<text x="26" y="200" class="t-sm">battery out first</text>
<!-- panel 2 -->
<line x1="282" y1="115" x2="326" y2="115" class="w-cable"/>
<rect x="326" y="105" width="22" height="20" rx="4" class="fill-bg"/>
<rect x="348" y="101" width="46" height="28" rx="5" class="box-sig"/><text x="371" y="119" text-anchor="middle" class="t-mono t-sig">JC200</text>
<rect x="394" y="105" width="22" height="20" rx="4" class="fill-bg"/>
<line x1="416" y1="115" x2="438" y2="115" class="w-cable"/>
<circle cx="448" cy="115" r="10" class="fill-bg"/><text x="448" y="119" text-anchor="middle" class="t-b" style="font-size:11px">Y</text>
<line x1="458" y1="115" x2="500" y2="115" class="w-cable"/>
<line x1="448" y1="125" x2="448" y2="170" class="w-cable"/>
<text x="304" y="150" class="t-sm">motor cable</text>
<text x="406" y="96" class="t-sm">L2 50</text>
<text x="286" y="200" class="t-sm">motor cable + L2 into JC200 #1</text>
<!-- panel 3 -->
<circle cx="560" cy="115" r="10" class="fill-bg"/><text x="560" y="119" text-anchor="middle" class="t-b" style="font-size:11px">Y</text>
<line x1="570" y1="115" x2="664" y2="115" class="w-cable"/>
<text x="616" y="104" text-anchor="middle" class="t-sm">L3 250</text>
<rect x="664" y="105" width="22" height="20" rx="4" class="fill-bg"/>
<rect x="690" y="80" width="70" height="70" rx="8" class="box"/><text x="725" y="120" text-anchor="middle">Display</text>
<line x1="560" y1="125" x2="560" y2="160" class="w-cable"/>
<rect x="538" y="160" width="44" height="22" rx="5" class="box-sig"/><text x="560" y="175" text-anchor="middle" class="t-mono t-sig" style="font-size:10px">JC200#2</text>
<text x="590" y="175" class="t-sm">empty port is fine</text>
<text x="546" y="205" class="t-sm">L1 waits for your board</text>
</svg>