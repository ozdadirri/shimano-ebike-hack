<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 250" role="img" aria-label="Power path schematic: BUS+ through polyfuse F1, Schottky D1, TVS to ground, jumper JP1, 470 microhenry inductor L1, 10 microfarad C2, buck converter U1 to 3.3 volts with 100 microfarad C3, to the XIAO 3V3 pin.">
<style>
svg { --bg: #eef2f0;
  --surface: #ffffff;
  --sunk: #e3e9e6;
  --fg: #15201c;
  --muted: #586661;
  --line: #c9d3cf;
  --signal: #c2410c;
  --signal-soft: #fbe3d6;
  --power: #0f766e;
  --power-soft: #d3eeeb;
  --gnd: #7a8783;
  --good: #2f7d32;
  --warn: #a15c07;
  --bad: #b42318;
  --good-soft: #dcefdc;
  --warn-soft: #f6e8cf;
  --bad-soft: #f7dcd8;
  --display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace; color: var(--fg); background: var(--surface); }
svg text { font-family: var(--body); font-size: 13px; fill: currentColor; }
svg .t-sm { font-size: 11.5px; fill: var(--muted); }
svg .t-mono { font-family: var(--mono); font-size: 11.5px; }
svg .t-b { font-weight: 700; }
svg .t-sig { fill: var(--signal); }
svg .t-pwr { fill: var(--power); }
svg .box { fill: var(--surface); stroke: currentColor; stroke-width: 1.4; }
svg .box-sunk { fill: var(--sunk); stroke: var(--line); stroke-width: 1.2; }
svg .box-sig { fill: var(--signal-soft); stroke: var(--signal); stroke-width: 1.4; }
svg .box-pwr { fill: var(--power-soft); stroke: var(--power); stroke-width: 1.4; }
svg .board { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 6 5; }
svg .w { fill: none; stroke: currentColor; stroke-width: 1.6; }
svg .w-sig { fill: none; stroke: var(--signal); stroke-width: 2.2; }
svg .w-pwr { fill: none; stroke: var(--power); stroke-width: 2.2; }
svg .w-gnd { fill: none; stroke: var(--gnd); stroke-width: 1.8; }
svg .w-cable { fill: none; stroke: currentColor; stroke-width: 4; stroke-linecap: round; }
svg .w-dash { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 5 5; }
svg .dot { fill: currentColor; }
svg .dot-sig { fill: var(--signal); }
svg .dot-pwr { fill: var(--power); }
svg .fill-fg { fill: currentColor; }
svg .fill-bg { fill: var(--surface); stroke: currentColor; stroke-width: 1.6; }
svg .hl { fill: var(--signal-soft); }
svg .grid { stroke: var(--line); stroke-width: 1; }
svg .pcb-board { fill: #163d27; stroke: #0a2114; stroke-width: 2; }
svg .pcb-dot { fill: #1f5636; }
svg .pcb-hole { fill: var(--surface); stroke: #d8b25a; stroke-width: 3; }
svg .pcb-slot { fill: var(--surface); stroke: #d8b25a; stroke-width: 1.5; }
svg .pcb-pad { fill: #d8b25a; }
svg .pcb-via { fill: #d8b25a; stroke: #163d27; stroke-width: 1.5; }
svg .pcb-silk { fill: none; stroke: #eef3ec; stroke-width: 1.2; }
svg .pcb-silkd { fill: none; stroke: #eef3ec; stroke-width: 1.2; stroke-dasharray: 5 4; }
svg .pcb-silkt { fill: #eef3ec; font-family: var(--mono); font-size: 10px; }
svg .pcb-tp { fill: none; stroke: #4fd6c8; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
svg .pcb-ts { fill: none; stroke: #ff9e62; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
svg .pcb-tg { fill: none; stroke: #d8b25a; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
svg .pcb-tb { fill: none; stroke: #9fb8ff; stroke-width: 4; stroke-dasharray: 7 5; stroke-linecap: round; }
svg .pcb-zone-p { fill: none; stroke: #4fd6c8; stroke-width: 1; stroke-dasharray: 4 4; }
svg .pcb-zone-s { fill: none; stroke: #ff9e62; stroke-width: 1; stroke-dasharray: 4 4; }
svg .pcb-ring { fill: none; stroke: #ff9e62; stroke-width: 2.5; }
</style>

      <!-- J1 -->
      <rect x="20" y="55" width="70" height="165" rx="6" class="box-sunk"/>
      <text x="55" y="45" text-anchor="middle" class="t-b">J1</text>
      <text x="55" y="140" text-anchor="middle" class="t-sm">pigtail</text>
      <text x="30" y="84" class="t-mono t-pwr">BUS+</text>
      <text x="30" y="204" class="t-mono">GND</text>
      <circle cx="90" cy="80" r="3.5" class="dot-pwr"/>
      <circle cx="90" cy="200" r="3.5" class="dot"/>
      <!-- rail -->
      <line x1="90" y1="80" x2="140" y2="80" class="w-pwr"/>
      <rect x="140" y="70" width="50" height="20" rx="3" class="box"/>
      <line x1="146" y1="88" x2="184" y2="72" class="w"/>
      <text x="165" y="60" text-anchor="middle" class="t-b">F1</text>
      <text x="165" y="112" text-anchor="middle" class="t-sm">PTC 100 mA</text>
      <line x1="190" y1="80" x2="232" y2="80" class="w-pwr"/>
      <polygon points="232,67 232,93 258,80" class="fill-fg"/>
      <line x1="260" y1="66" x2="260" y2="94" class="w" style="stroke-width:2.4"/>
      <text x="246" y="60" text-anchor="middle" class="t-b">D1</text>
      <text x="246" y="112" text-anchor="middle" class="t-sm">SS14</text>
      <line x1="260" y1="80" x2="380" y2="80" class="w-pwr"/>
      <circle cx="330" cy="80" r="3.5" class="dot-pwr"/>
      <!-- TVS -->
      <line x1="330" y1="80" x2="330" y2="122" class="w"/>
      <path d="M316,118 L320,122 L340,122 L344,126" class="w" style="stroke-width:2.2"/>
      <polygon points="318,146 342,146 330,124" class="fill-fg"/>
      <line x1="330" y1="146" x2="330" y2="200" class="w-gnd"/>
      <text x="352" y="134" class="t-b">TVS1</text>
      <text x="352" y="150" class="t-sm">SMAJ15A</text>
      <!-- JP1 -->
      <circle cx="388" cy="80" r="5" class="fill-bg"/>
      <circle cx="420" cy="80" r="5" class="fill-bg"/>
      <path d="M388,70 Q404,52 420,70" class="w-dash"/>
      <text x="404" y="44" text-anchor="middle" class="t-b">JP1</text>
      <text x="404" y="104" text-anchor="middle" class="t-sm">close in Stage B</text>
      <line x1="425" y1="80" x2="460" y2="80" class="w-pwr"/>
      <!-- L1 -->
      <path d="M460,80 a14,14 0 0 1 28,0 a14,14 0 0 1 28,0 a14,14 0 0 1 28,0 a14,14 0 0 1 28,0" class="w" style="stroke-width:2"/>
      <text x="516" y="54" text-anchor="middle" class="t-b">L1 470 µH</text>
      <text x="516" y="104" text-anchor="middle" class="t-sm">blocks 1 MHz</text>
      <line x1="572" y1="80" x2="660" y2="80" class="w-pwr"/>
      <circle cx="610" cy="80" r="3.5" class="dot-pwr"/>
      <!-- C2 -->
      <line x1="610" y1="80" x2="610" y2="128" class="w"/>
      <line x1="594" y1="128" x2="626" y2="128" class="w" style="stroke-width:2.4"/>
      <line x1="594" y1="138" x2="626" y2="138" class="w" style="stroke-width:2.4"/>
      <line x1="610" y1="138" x2="610" y2="200" class="w-gnd"/>
      <text x="632" y="136" class="t-b">C2</text>
      <text x="632" y="152" class="t-sm">10 µF</text>
      <!-- U1 -->
      <rect x="660" y="55" width="130" height="110" rx="6" class="box-pwr"/>
      <text x="725" y="100" text-anchor="middle" class="t-b">U1 buck</text>
      <text x="725" y="118" text-anchor="middle" class="t-sm">D36V6F3 → 3.3 V</text>
      <text x="667" y="76" class="t-mono" style="font-size:10px">VIN</text>
      <text x="783" y="76" text-anchor="end" class="t-mono" style="font-size:10px">VOUT</text>
      <text x="700" y="160" class="t-mono" style="font-size:10px">GND</text>
      <line x1="712" y1="165" x2="712" y2="200" class="w-gnd"/>
      <line x1="790" y1="80" x2="900" y2="80" class="w-pwr"/>
      <circle cx="840" cy="80" r="3.5" class="dot-pwr"/>
      <line x1="840" y1="80" x2="840" y2="128" class="w"/>
      <line x1="824" y1="128" x2="856" y2="128" class="w" style="stroke-width:2.4"/>
      <path d="M824,142 Q840,132 856,142" class="w" style="stroke-width:2.4"/>
      <line x1="840" y1="137" x2="840" y2="200" class="w-gnd"/>
      <text x="818" y="124" text-anchor="end" class="t-sm">+</text>
      <text x="862" y="136" class="t-b">C3</text>
      <text x="862" y="152" class="t-sm">100 µF</text>
      <text x="900" y="70" text-anchor="end" class="t-mono t-pwr">→ XIAO 3V3</text>
      <!-- GND rail -->
      <line x1="90" y1="200" x2="900" y2="200" class="w-gnd"/>
      <text x="900" y="222" text-anchor="end" class="t-mono">GND → XIAO GND</text>
    </svg>